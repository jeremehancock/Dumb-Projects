<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.06">
    <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200" stroke="white"/>
    <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300M1000 0V300M1100 0V300" stroke="white"/>
  </g>

  <!-- Ambient glows -->
  <circle cx="90" cy="70" r="55" fill="#22d3ee" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1120" cy="240" r="70" fill="#a855f7" opacity="0.15" filter="url(#glow)"/>

  <!-- Left decorative cards -->
  <g opacity="0.85">
    <rect x="40" y="110" width="80" height="60" rx="12" fill="#1f2937"/>
    <rect x="55" y="125" width="16" height="16" rx="3" fill="#22d3ee"/>
    <rect x="80" y="128" width="25" height="4" rx="2" fill="#64748b"/>
    <rect x="80" y="138" width="18" height="4" rx="2" fill="#475569"/>

    <rect x="90" y="185" width="70" height="55" rx="10" fill="#1f2937"/>
    <circle cx="115" cy="212" r="8" fill="#f472b6"/>
  </g>

  <!-- Logo -->
  <g transform="translate(190,70)">
    <rect width="160" height="160" rx="28" fill="#0b1220" stroke="#334155" stroke-width="2"/>

    <path d="M48 80L80 48V112L48 80Z" fill="url(#accent1)"/>
    <path d="M112 48L80 80L112 112V48Z" fill="url(#accent2)"/>
    <circle cx="80" cy="80" r="10" fill="#fbbf24"/>
  </g>

  <!-- Main text -->
  <text x="390"
        y="130"
        fill="white"
        font-size="64"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="700">
    DumbProjects
  </text>

  <text x="392"
        y="178"
        fill="#94a3b8"
        font-size="24"
        font-family="Arial, Helvetica, sans-serif">
    AI-built apps • Tools • Games • Random ideas
  </text>

  <!-- Right-side icons moved away from text -->
  <g transform="translate(980,60)">
    <rect width="70" height="70" rx="14" fill="#1f2937"/>
    <path d="M18 20H52V50H18Z" stroke="#22d3ee" stroke-width="4"/>
    <path d="M25 30H45" stroke="#22d3ee" stroke-width="4"/>
    <path d="M25 40H40" stroke="#22d3ee" stroke-width="4"/>
  </g>

  <g transform="translate(1070,135)">
    <rect width="70" height="70" rx="14" fill="#1f2937"/>
    <path d="M22 22L48 35L22 48V22Z" fill="#f472b6"/>
  </g>

  <g transform="translate(980,210)">
    <rect width="70" height="70" rx="14" fill="#1f2937"/>
    <path d="M22 22H48V48H22Z" fill="#fbbf24"/>
    <path d="M30 30H40V40H30Z" fill="#111827"/>
  </g>
</svg>
